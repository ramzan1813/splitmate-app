# Builds the EvenUp APK in the cloud for free.
# Triggers:
# 1. Automatic on commit message containing: [build], [apk], [release], build:, release:
# 2. Automatic on Git version tag: v* (e.g. v1.4.1)
# 3. Manual trigger: Actions tab -> "Build Android APK" -> Run workflow.
#
# Releases:
# - Commits with [release] or tags create/update the GitHub Release with the APK.
# - Commits with [build] or [apk] produce the APK as an artifact for instant download.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish/Update GitHub Release'
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
      - 'feat/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    # Run if triggered manually, pushed via tag, or if commit message contains build/release directives
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[apk]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, 'build:') ||
      contains(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.apk.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Check release trigger type
        id: check
        # Passed as environment variables, never pasted into the script: a commit message with quotes or
        # backticks would otherwise break the script or run as shell commands (script injection).
        env:
          MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          RELEASE_INPUT: ${{ github.event.inputs.create_release }}
        run: |
          IS_REL="false"
          if [[ "$REF" == refs/tags/v* ]]; then
            IS_REL="true"
          elif [[ "$EVENT" == "workflow_dispatch" && "$RELEASE_INPUT" == "true" ]]; then
            IS_REL="true"
          elif [[ "$MSG" == *"[release]"* || "$MSG" == *"release:"* ]]; then
            IS_REL="true"
          fi
          echo "is_release=$IS_REL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache & optimizations
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        # The unit tests start the sync server in-process (relay/test-support), so they need the
        # server's packages too. --ignore-scripts skips wrangler's runtime download, which tests don't use.
        run: |
          npm ci
          npm ci --prefix relay --ignore-scripts

      - name: Type check and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLITMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SPLITMATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No SPLITMATE_KEYSTORE_BASE64 secret - APK will be signed with the DEBUG key (testing only). See SIGNING.md."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SPLITMATE_KEYSTORE_PASSWORD: ${{ secrets.SPLITMATE_KEYSTORE_PASSWORD }}
          SPLITMATE_KEY_ALIAS: ${{ secrets.SPLITMATE_KEY_ALIAS }}
          SPLITMATE_KEY_PASSWORD: ${{ secrets.SPLITMATE_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        run: ./gradlew assembleRelease --build-cache --parallel

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv android/app/build/outputs/apk/release/app-release.apk "EvenUp-$VERSION.apk"
          sha256sum "EvenUp-$VERSION.apk" | tee "EvenUp-$VERSION.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: evenup-apk
          path: |
            EvenUp-*.apk
            EvenUp-*.apk.sha256
          retention-days: 30

  # Publishes the APK as a GitHub Release when requested (via tag, [release] commit, or manual workflow)
  release:
    name: Publish Release
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the release; only this job gets it
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: evenup-apk

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          # this version's section of CHANGELOG.md (from "## <version>" up to the next "## "), without its heading
          CHANGES=$(awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2)
          if [ -z "$CHANGES" ]; then
            echo "::warning::CHANGELOG.md has no '## $VERSION' section - the release will only have install instructions."
          fi
          NOTES="$CHANGES

          ---
          ### Install
          Download EvenUp-$VERSION.apk below, open it on your phone and tap Install.
          Android will ask to allow installing from this source, and Play Protect may show
          'Unknown app': tap More details -> Install anyway.

          SHA-256: $(cut -d' ' -f1 "EvenUp-$VERSION.apk.sha256")
          Built from commit ${GITHUB_SHA::7}."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing its APK."
            gh release upload "$TAG" "EvenUp-$VERSION.apk" "EvenUp-$VERSION.apk.sha256" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "EvenUp-$VERSION.apk" "EvenUp-$VERSION.apk.sha256" \
              --target "$GITHUB_SHA" --title "EvenUp $VERSION" --notes "$NOTES" --latest
          fi
