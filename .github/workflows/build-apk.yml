# Builds the SplitMate APK in the cloud for free.
# 1. Push this folder (splitmate-app) to a GitHub repository.
# 2. (Recommended) add the 4 signing secrets — see SIGNING.md.
# 3. Actions tab -> "Build Android APK" -> Run workflow.
# 4. Download the APK from the repo's Releases section (right side of the main page),
#    or from the "splitmate-apk" artifact of the finished run.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4: v3 tried to install the old "tools" package, which Google no longer serves
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLITMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SPLITMATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No SPLITMATE_KEYSTORE_BASE64 secret - APK will be signed with the DEBUG key (testing only). See SIGNING.md."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SPLITMATE_KEYSTORE_PASSWORD: ${{ secrets.SPLITMATE_KEYSTORE_PASSWORD }}
          SPLITMATE_KEY_ALIAS: ${{ secrets.SPLITMATE_KEY_ALIAS }}
          SPLITMATE_KEY_PASSWORD: ${{ secrets.SPLITMATE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv android/app/build/outputs/apk/release/app-release.apk "SplitMate-$VERSION.apk"
          sha256sum "SplitMate-$VERSION.apk" | tee "SplitMate-$VERSION.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: splitmate-apk
          path: |
            SplitMate-*.apk
            SplitMate-*.apk.sha256
          retention-days: 30

  # Publishes the APK as a GitHub Release so it shows under "Releases" on the repo page.
  # Release tag = v<version from app.json>. Re-running for the same version replaces the APK.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the release; only this job gets it
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: splitmate-apk

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          # this version's section of CHANGELOG.md (from "## <version>" up to the next "## "), without its heading
          CHANGES=$(awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2)
          if [ -z "$CHANGES" ]; then
            echo "::warning::CHANGELOG.md has no '## $VERSION' section - the release will only have install instructions."
          fi
          NOTES="$CHANGES

          ---
          ### Install
          Download SplitMate-$VERSION.apk below, open it on your phone and tap Install.
          Android will ask to allow installing from this source, and Play Protect may show
          'Unknown app': tap More details -> Install anyway.

          SHA-256: $(cut -d' ' -f1 "SplitMate-$VERSION.apk.sha256")
          Built from commit ${GITHUB_SHA::7}."
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing its APK."
            gh release upload "$TAG" "SplitMate-$VERSION.apk" "SplitMate-$VERSION.apk.sha256" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "SplitMate-$VERSION.apk" "SplitMate-$VERSION.apk.sha256" \
              --target "$GITHUB_SHA" --title "SplitMate $VERSION" --notes "$NOTES" --latest
          fi
