# Builds the SplitMate APK in the cloud for free.
# 1. Push this folder (splitmate-app) to a GitHub repository.
# 2. (Recommended) add the 4 signing secrets — see SIGNING.md.
# 3. Actions tab -> "Build Android APK" -> Run workflow.
# 4. Download "splitmate-apk" from the finished run's Artifacts section.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLITMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SPLITMATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No SPLITMATE_KEYSTORE_BASE64 secret - APK will be signed with the DEBUG key (testing only). See SIGNING.md."
          fi

      - name: Build release APK
        working-directory: android
        env:
          SPLITMATE_KEYSTORE_PASSWORD: ${{ secrets.SPLITMATE_KEYSTORE_PASSWORD }}
          SPLITMATE_KEY_ALIAS: ${{ secrets.SPLITMATE_KEY_ALIAS }}
          SPLITMATE_KEY_PASSWORD: ${{ secrets.SPLITMATE_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mv android/app/build/outputs/apk/release/app-release.apk "SplitMate-$VERSION.apk"
          sha256sum "SplitMate-$VERSION.apk" | tee "SplitMate-$VERSION.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: splitmate-apk
          path: |
            SplitMate-*.apk
            SplitMate-*.apk.sha256
          retention-days: 30
