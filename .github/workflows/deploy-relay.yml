# Deploys the SplitMate sync API (relay/) to Cloudflare Workers.
# Triggers:
# 1. Push to main that touches relay/ (or this workflow).
# 2. Manual: Actions tab -> "Deploy relay" -> Run workflow (any branch).
#
# Order: tests -> database migrations -> Worker deploy, so new code never runs against an old schema.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#   DATABASE_URL           Same Postgres URL as the Worker's DATABASE_URL secret (used for migrations)
# Worker runtime secrets (DATABASE_URL, ADMIN_API_KEY) live in Cloudflare and persist across deploys.

name: Deploy relay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: relay
      - run: npm run typecheck
        working-directory: relay
      - run: npm test

  deploy:
    name: Migrate and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: relay

      - name: Apply database migrations
        working-directory: relay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set"
            exit 1
          fi
          npm run migrate

      - name: Deploy Worker
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}"

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://splitmate-relay.rn45819.workers.dev/health/db; then exit 0; fi
            sleep 10
          done
          echo "::error::Deployed Worker cannot reach the database (check the Worker's DATABASE_URL secret)"
          exit 1
