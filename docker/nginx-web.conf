# Serves the Expo web export. Mirrors metro.config.js: expo-sqlite on web needs
# SharedArrayBuffer, which requires cross-origin isolation headers.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location / {
    # Single-page output: every route falls back to index.html (expo-router handles it client-side).
    try_files $uri $uri/ /index.html;
  }
}
