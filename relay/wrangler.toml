name = "splitmate-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# nodejs_compat provides node:http/net/tls for Express and pg; the date enables
# the Node HTTP server bridge used by httpServerHandler.
compatibility_flags = ["nodejs_compat"]

# Run the Worker next to the database (Neon, AWS us-east-2), not next to each user. Every sync request
# makes many sequential queries; this cuts each round trip from ~250 ms (Asia -> Ohio) to a few ms.
# Change the region if the database moves.
[placement]
region = "aws:us-east-2"

# Retries pending webhook / Expo push notifications every minute.
[triggers]
crons = ["* * * * *"]

# Optional: put Hyperdrive in front of Postgres for pooled, low-latency connections.
#   npx wrangler hyperdrive create splitmate-db --connection-string="postgresql://..."
# then uncomment and paste the id. Without it the Worker uses the DATABASE_URL secret.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# Secrets (never commit them):
#   npx wrangler secret put DATABASE_URL       # Postgres connection string (Neon in production)
#   npx wrangler secret put ADMIN_API_KEY      # protects webhook management routes
#   npx wrangler secret put EXPO_ACCESS_TOKEN  # optional, if Expo push security is enabled
# Local dev: put the same keys in relay/.dev.vars

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1
