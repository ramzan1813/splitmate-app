services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitmate-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:YourStrongPostgresPasswordHere@splitmate_postgres:5432/EvenUp}
      PORT: ${PORT:-8080}
      HOST: 0.0.0.0
      DEBUG: ${DEBUG:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
   
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    external: true 


volumes:
  postgres_data:

